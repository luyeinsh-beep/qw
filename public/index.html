<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - 餐饮评估工作台</title>
<style>
:root {
  --primary: #2563EB;
  --primary-light: #DBEAFE;
  --primary-dark: #1D4ED8;
  --bg: #F1F5F9;
  --card: #FFFFFF;
  --text: #1E293B;
  --text-secondary: #64748B;
  --border: #E2E8F0;
  --danger: #EF4444;
  --radius: 12px;
  --radius-sm: 8px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh; padding: 20px;
}
.login-wrapper {
  width: 100%; max-width: 420px;
}
.login-header {
  text-align: center; margin-bottom: 28px;
}
.login-header .logo { font-size: 48px; margin-bottom: 8px; }
.login-header h1 { font-size: 22px; font-weight: 800; color: var(--text); }
.login-header p { font-size: 14px; color: var(--text-secondary); margin-top: 4px; }
.login-card {
  background: var(--card); border-radius: var(--radius);
  padding: 32px; box-shadow: 0 4px 16px rgba(0,0,0,.06);
}
.tabs { display: flex; margin-bottom: 24px; border-bottom: 2px solid var(--border); }
.tab {
  flex: 1; padding: 10px; text-align: center; font-size: 15px; font-weight: 600;
  background: none; border: none; color: var(--text-secondary); cursor: pointer;
  border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all .2s;
  font-family: inherit;
}
.tab.active { color: var(--primary); border-bottom-color: var(--primary); }
.form-group { margin-bottom: 16px; display: flex; flex-direction: column; gap: 6px; }
.form-group label { font-size: 13px; font-weight: 600; color: var(--text-secondary); }
.form-group input {
  padding: 10px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm);
  font-size: 14px; font-family: inherit; outline: none; transition: border-color .2s;
}
.form-group input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
.btn {
  width: 100%; padding: 11px; border-radius: var(--radius-sm); font-size: 15px;
  font-weight: 700; cursor: pointer; border: none; transition: all .2s; font-family: inherit;
}
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-primary:disabled { opacity: .6; cursor: not-allowed; }
.error-msg {
  background: #FEF2F2; border: 1px solid #FECACA; color: #991B1B;
  padding: 10px 14px; border-radius: var(--radius-sm); font-size: 13px;
  margin-bottom: 16px; display: none;
}
.error-msg.show { display: block; }
.footer-note {
  text-align: center; margin-top: 24px; font-size: 13px; color: var(--text-secondary);
}
#registerFields { display: none; }
</style>
</head>
<body>

<div class="login-wrapper">
  <div class="login-header">
    <div class="logo">🍽️</div>
    <h1>餐饮评估工作台</h1>
    <p>门店经营优化 · 7维评估系统</p>
  </div>

  <div class="login-card">
    <div class="tabs">
      <button class="tab active" onclick="switchTab('login')">登 录</button>
      <button class="tab" onclick="switchTab('register')">注 册</button>
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <form id="authForm" onsubmit="handleSubmit(event)">
      <div class="form-group">
        <label>用户名</label>
        <input type="text" id="username" placeholder="请输入用户名" required autocomplete="username">
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" id="password" placeholder="请输入密码" required autocomplete="current-password">
      </div>
      <div id="registerFields">
        <div class="form-group">
          <label>昵称（对外显示）</label>
          <input type="text" id="displayName" placeholder="你的名字，同事会看到">
        </div>
      </div>
      <button type="submit" class="btn btn-primary" id="submitBtn">登 录</button>
    </form>
  </div>

  <div class="footer-note">
    团队协作 · 共享商户数据 · 云端安全存储
  </div>
</div>

<script>
let currentTab = 'login';

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.textContent.trim() === (tab === 'login' ? '登 录' : '注 册')));
  document.getElementById('registerFields').style.display = tab === 'register' ? 'block' : 'none';
  document.getElementById('submitBtn').textContent = tab === 'login' ? '登 录' : '注 册';
  document.getElementById('errorMsg').classList.remove('show');
  if (tab === 'register') {
    document.getElementById('displayName').required = true;
  } else {
    document.getElementById('displayName').required = false;
  }
}

function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.classList.add('show');
}

async function handleSubmit(e) {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  document.getElementById('errorMsg').classList.remove('show');

  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;

  if (!username || !password) {
    showError('请填写用户名和密码');
    btn.disabled = false;
    return;
  }

  try {
    const endpoint = currentTab === 'login' ? '/api/auth/login' : '/api/auth/register';
    const body = { username, password };
    if (currentTab === 'register') {
      const displayName = document.getElementById('displayName').value.trim();
      if (!displayName) { showError('请填写昵称'); btn.disabled = false; return; }
      body.display_name = displayName;
    }

    const resp = await fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });

    const data = await resp.json();
    if (!resp.ok) {
      showError(data.error || '操作失败');
      btn.disabled = false;
      return;
    }

    // Store token and redirect
    localStorage.setItem('rw_token', data.token);
    localStorage.setItem('rw_user', JSON.stringify(data.user));
    window.location.href = '/app';
  } catch (err) {
    showError('网络错误，请检查连接');
    btn.disabled = false;
  }
}
</script>

</body>
</html>
